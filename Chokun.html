<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บของโชกุน</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ffd700;
            text-align: center;
        }

        header {
            background-color: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 20px 0;
        }

        header h1 {
            font-size: 2.5em;
            margin: 0;
        }

        main {
            padding: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            display: inline-block;
            margin-top: 20px;
        }

        p {
            font-size: 1.2em;
            margin: 20px 0;
        }

        footer {
            margin-top: 40px;
            background-color: rgba(0, 0, 0, 0.7);
            color: #ff4500;
            padding: 10px 0;
        }

        footer p {
            margin: 0;
            font-size: 0.9em;
        }

        .profile-image {
            margin-top: 20px;
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 3px solid #ffd700;
        }
    </style>
</head>
<body>
    <header>
        <h1>สวัสดี! เราชื่อโชกุนนะ</h1>
    </header>
    <main>
        <p>ถ้าใครเข้ามา แสดงว่ารู้จักเราอยู่แล้วสิ</p>
        <p>คิดว่าน่าจะเป็นฟันแตกนะ ควย!</p>
    </main>
    <footer>
        <p>สร้างด้วย ❤️ โดยโชกุน</p>
    </footer>
</body>
</html>
